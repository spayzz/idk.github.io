<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMORI — Белое Пространство (Интерактивная RPG)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Comfortaa:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --omori-black: #08080a;
            --omori-white: #f8f8f6;
            --omori-red: #e62e3d;
            --omori-blue: #3b82f6;
            --omori-cyan: #22d3ee;
            --omori-pink: #f472b6;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #050507;
            color: #f8f8f6;
            font-family: 'Caveat', 'Comfortaa', cursive, sans-serif;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Декоративная текстура бумаги и виньетка */
        .crt-overlay {
            pointer-events: none;
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.65) 100%);
            z-index: 40;
        }

        /* Стилизация кнопок в духе рисованного интерфейса OMORI */
        .omori-btn {
            background: #0a0a0d;
            color: #ffffff;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px #0a0a0d, 0 0 0 4px #ffffff;
            font-family: 'Comfortaa', sans-serif;
            font-weight: 700;
            transition: transform 0.08s ease, background-color 0.12s ease, color 0.12s ease;
            cursor: pointer;
            touch-action: manipulation;
        }

        .omori-btn:hover {
            background: #1c1c24;
        }

        .omori-btn:active, .omori-btn.active-press {
            transform: scale(0.94);
            background: #ffffff;
            color: #0a0a0d;
        }

        .omori-btn-red {
            border-color: #ef4444;
            box-shadow: 0 0 0 2px #0a0a0d, 0 0 0 4px #ef4444;
        }

        #canvas-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 880px;
            aspect-ratio: 4 / 3;
            max-height: calc(100dvh - 64px);
            padding: 8px;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #ffffff;
            border: 3px solid #ffffff;
            box-shadow: 0 0 0 3px #000000, 0 0 0 6px #ffffff, 0 18px 50px rgba(0,0,0,0.9);
            border-radius: 4px;
            image-rendering: auto;
            cursor: pointer;
        }
    </style>
</head>
<body class="select-none">
    <div class="crt-overlay"></div>

    <!-- Верхняя панель статуса и управления звуком -->
    <header class="w-full max-w-[880px] px-3 py-1.5 flex items-center justify-between gap-2 z-30">
        <div class="flex items-center gap-2.5">
            <div class="w-3 h-3 bg-white rounded-full animate-pulse border border-black"></div>
            <span class="font-bold tracking-widest text-sm sm:text-base text-white uppercase" style="font-family: 'Comfortaa', sans-serif;">
                АНЯ <span class="text-xs text-zinc-400 font-normal hidden sm:inline">// БЕЛОЕ ПРОСТРАНСТВО</span>

        <div class="flex items-center gap-2 sm:gap-3">

    <!-- Игровой холст -->
    <main id="canvas-container" class="z-20">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </main>

    <script>
        /***********************************************************************
         * OMORI — ИНТЕРАКТИВНАЯ HTML5 CANVAS RPG НА РУССКОМ ЯЗЫКЕ
         * Включает:
         * - Эффект карандашного дрожания линий (Line-Boil каждые 150 мс)
         * - Процедурную музыку и звуки на Web Audio API (White Space, Dreamworld, Battle, Awakening)
         * - Полную анимацию Омори в 4 направлениях
         * - Белое Пространство, интерактивный Альбом с зарисовками, Дневник в ноутбуке
         * - Коридор Воспоминаний с силуэтами друзей и Красными Руками
         * - Полноценную пошаговую битву в стиле OMORI с системой ЭМОЦИЙ
         ***********************************************************************/

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const locationBadge = document.getElementById('location-badge');

        // Внутреннее разрешение холста
        const W = 800;
        const H = 600;

        // Глобальный таймер для эффекта карандашной рисовки (line-boil каждые 150 мс)
        let boilFrame = 0;
        let lastBoilTime = 0;
        const BOIL_INTERVAL = 150;

        // Таблица детерминированных смещений для эффекта «дрожащего карандаша»
        function boilOffset(seed, amplitude = 1.6) {
            const s = (seed * 17 + boilFrame * 31) % 97;
            return ((s / 97) - 0.5) * 2 * amplitude;
        }

        // Рисование «дрожащей» карандашной линии
        function drawSketchLine(x1, y1, x2, y2, color = '#000', lineWidth = 2, seed = 1, segments = 4) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(x1 + boilOffset(seed, 1.1), y1 + boilOffset(seed + 1, 1.1));
            for (let i = 1; i <= segments; i++) {
                const t = i / segments;
                const nx = x1 + (x2 - x1) * t + (i < segments ? boilOffset(seed + i * 7, 1.4) : boilOffset(seed + 99, 0.9));
                const ny = y1 + (y2 - y1) * t + (i < segments ? boilOffset(seed + i * 13, 1.4) : boilOffset(seed + 105, 0.9));
                ctx.lineTo(nx, ny);
            }
            ctx.stroke();
            ctx.restore();
        }

        // Рисование «дрожащего» прямоугольника или окна интерфейса OMORI
        function drawOmoriBox(x, y, w, h, options = {}) {
            const {
                fill = '#08080a',
                border = '#ffffff',
                doubleBorder = true,
                seed = 10,
                boilAmp = 1.3
            } = options;

            ctx.save();
            // Основная заливка
            ctx.fillStyle = fill;
            ctx.beginPath();
            ctx.moveTo(x + boilOffset(seed, boilAmp), y + boilOffset(seed + 1, boilAmp));
            ctx.lineTo(x + w + boilOffset(seed + 2, boilAmp), y + boilOffset(seed + 3, boilAmp));
            ctx.lineTo(x + w + boilOffset(seed + 4, boilAmp), y + h + boilOffset(seed + 5, boilAmp));
            ctx.lineTo(x + boilOffset(seed + 6, boilAmp), y + h + boilOffset(seed + 7, boilAmp));
            ctx.closePath();
            ctx.fill();

            // Внешняя рисованная рамка
            ctx.strokeStyle = border;
            ctx.lineWidth = 3;
            ctx.stroke();

            // Вторая (двойная карандашная) внутренняя рамка
            if (doubleBorder) {
                const pad = 5;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x + pad + boilOffset(seed + 11, boilAmp * 0.8), y + pad + boilOffset(seed + 12, boilAmp * 0.8));
                ctx.lineTo(x + w - pad + boilOffset(seed + 13, boilAmp * 0.8), y + pad + boilOffset(seed + 14, boilAmp * 0.8));
                ctx.lineTo(x + w - pad + boilOffset(seed + 15, boilAmp * 0.8), y + h - pad + boilOffset(seed + 16, boilAmp * 0.8));
                ctx.lineTo(x + pad + boilOffset(seed + 17, boilAmp * 0.8), y + h - pad + boilOffset(seed + 18, boilAmp * 0.8));
                ctx.closePath();
                ctx.stroke();
            }
            ctx.restore();
        }

        // Рисование дрожащей окружности / овала
        function drawSketchCircle(cx, cy, rx, ry, fill, stroke, lineWidth = 2, seed = 1) {
            ctx.save();
            ctx.beginPath();
            const steps = 16;
            for (let i = 0; i <= steps; i++) {
                const a = (i / steps) * Math.PI * 2;
                const rOx = boilOffset(seed + i * 3, 1.2);
                const rOy = boilOffset(seed + i * 5 + 1, 1.2);
                const px = cx + Math.cos(a) * rx + rOx;
                const py = cy + Math.sin(a) * ry + rOy;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            if (fill) {
                ctx.fillStyle = fill;
                ctx.fill();
            }
            if (stroke) {
                ctx.strokeStyle = stroke;
                ctx.lineWidth = lineWidth;
                ctx.stroke();
            }
            ctx.restore();
        }

        /***********************************************************************
         * WEB AUDIO API — ПРОЦЕДУРНЫЙ САУНДТРЕК И ЗВУКОВЫЕ ЭФФЕКТЫ OMORI
         ***********************************************************************/
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.currentTheme = 'none';
                this.noteIndex = 0;
                this.nextNoteTime = 0;
                this.isPlaying = false;

                // Мелодии в стиле OMORI
                // 1. White Space (вальс 3/4, меланхоличное пианино)
                this.whiteSpaceNotes = [
                    { f: 659.25, d: 0.48 }, // E5
                    { f: 493.88, d: 0.48 }, // B4
                    { f: 392.00, d: 0.48 }, // G4
                    { f: 659.25, d: 0.48 }, // E5
                    { f: 493.88, d: 0.48 }, // B4
                    { f: 392.00, d: 0.48 }, // G4
                    { f: 622.25, d: 0.48 }, // D#5
                    { f: 493.88, d: 0.48 }, // B4
                    { f: 369.99, d: 0.48 }, // F#4
                    { f: 622.25, d: 0.48 }, // D#5
                    { f: 493.88, d: 0.48 }, // B4
                    { f: 369.99, d: 0.48 }, // F#4
                    { f: 587.33, d: 0.48 }, // D5
                    { f: 440.00, d: 0.48 }, // A4
                    { f: 349.23, d: 0.48 }, // F4
                    { f: 523.25, d: 0.48 }, // C5
                    { f: 440.00, d: 0.48 }, // A4
                    { f: 329.63, d: 0.48 }  // E4
                ];

                // 2. Коридор Воспоминаний (хрупкая музыкальная шкатулка с диссонансом)
                this.corridorNotes = [
                    { f: 523.25, d: 0.55 }, // C5
                    { f: 659.25, d: 0.55 }, // E5
                    { f: 587.33, d: 0.55 }, // D5
                    { f: 493.88, d: 0.55 }, // B4
                    { f: 440.00, d: 0.55 }, // A4
                    { f: 392.00, d: 0.55 }, // G4
                    { f: 369.99, d: 0.70 }, // F#4
                    { f: 329.63, d: 0.75 }  // E4
                ];

                // 3. Тема битвы с ЧТО-ТО (тревожный пульс и высокий скрип)
                this.battleNotes = [
                    { f: 110.00, d: 0.32, type: 'sawtooth' },
                    { f: 116.54, d: 0.32, type: 'sawtooth' },
                    { f: 880.00, d: 0.16, type: 'triangle' },
                    { f: 110.00, d: 0.32, type: 'sawtooth' },
                    { f: 932.33, d: 0.16, type: 'triangle' },
                    { f: 103.83, d: 0.42, type: 'sawtooth' },
                    { f: 783.99, d: 0.25, type: 'triangle' },
                    { f: 73.42,  d: 0.45, type: 'sawtooth' }
                ];

                // 4. Светлая концовка (Пробуждение / Duet-подобная теплая гармония)
                this.endingNotes = [
                    { f: 523.25, d: 0.65 }, // C5
                    { f: 392.00, d: 0.65 }, // G4
                    { f: 440.00, d: 0.65 }, // A4
                    { f: 329.63, d: 0.65 }, // E4
                    { f: 349.23, d: 0.65 }, // F4
                    { f: 523.25, d: 0.65 }, // C5
                    { f: 493.88, d: 0.65 }, // B4
                    { f: 392.00, d: 0.85 }  // G4
                ];
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.isPlaying = true;
            }

            toggleMute() {
                this.init();
                this.muted = !this.muted;
                return this.muted;
            }

            setTheme(theme) {
                if (this.currentTheme !== theme) {
                    this.currentTheme = theme;
                    this.noteIndex = 0;
                    if (this.ctx) {
                        this.nextNoteTime = this.ctx.currentTime + 0.08;
                    }
                }
            }

            update() {
                if (!this.ctx || this.muted || !this.isPlaying || this.currentTheme === 'none') return;
                if (this.ctx.state === 'suspended') return;

                const now = this.ctx.currentTime;
                if (now >= this.nextNoteTime) {
                    let list = this.whiteSpaceNotes;
                    if (this.currentTheme === 'corridor') list = this.corridorNotes;
                    else if (this.currentTheme === 'battle') list = this.battleNotes;
                    else if (this.currentTheme === 'ending') list = this.endingNotes;

                    const note = list[this.noteIndex % list.length];
                    this.playPianoNote(note.f, note.d, note.type || 'sine');
                    this.noteIndex++;
                    this.nextNoteTime = now + note.d;
                }
            }

            playPianoNote(freq, duration, wave = 'sine') {
                if (!this.ctx || this.muted) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const sub = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const filter = this.ctx.createBiquadFilter();

                    osc.type = wave === 'sawtooth' ? 'sawtooth' : 'triangle';
                    sub.type = 'sine';

                    osc.frequency.setValueAtTime(freq, now);
                    sub.frequency.setValueAtTime(freq * 0.5, now);

                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(wave === 'sawtooth' ? 520 : 1350, now);

                    const peak = wave === 'sawtooth' ? 0.045 : 0.065;
                    gain.gain.setValueAtTime(0.0001, now);
                    gain.gain.linearRampToValueAtTime(peak, now + 0.025);
                    gain.gain.exponentialRampToValueAtTime(0.0008, now + duration * 1.35);

                    osc.connect(filter);
                    sub.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(now);
                    sub.start(now);
                    osc.stop(now + duration * 1.4);
                    sub.stop(now + duration * 1.4);
                } catch (e) {}
            }

            playTextBlip(pitch = 540, creepy = false) {
                if (!this.ctx || this.muted) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = creepy ? 'sawtooth' : 'square';
                    osc.frequency.setValueAtTime(creepy ? 170 + Math.random() * 50 : pitch + (Math.random() * 40 - 20), now);
                    gain.gain.setValueAtTime(0.028, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } catch (e) {}
            }

            playCursor() {
                if (!this.ctx || this.muted) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(780, now);
                    gain.gain.setValueAtTime(0.04, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.055);
                } catch (e) {}
            }

            playConfirm() {
                if (!this.ctx || this.muted) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(783.99, now + 0.05);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.17);
                } catch (e) {}
            }

            playSlash() {
                if (!this.ctx || this.muted) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(920, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.19);
                    gain.gain.setValueAtTime(0.11, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.22);
                } catch (e) {}
            }

            playHeal() {
                if (!this.ctx || this.muted) return;
                try {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((f, idx) => {
                        const now = this.ctx.currentTime + idx * 0.06;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(f, now);
                        gain.gain.setValueAtTime(0.05, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.19);
                    });
                } catch (e) {}
            }

            playScare() {
                if (!this.ctx || this.muted) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc1 = this.ctx.createOscillator();
                    const osc2 = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc1.type = 'sawtooth';
                    osc2.type = 'square';
                    osc1.frequency.setValueAtTime(98, now);
                    osc2.frequency.setValueAtTime(104.5, now);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                    osc1.connect(gain);
                    osc2.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc1.start(now);
                    osc2.start(now);
                    osc1.stop(now + 0.66);
                    osc2.stop(now + 0.66);
                } catch (e) {}
            }

            playBark() {
                if (!this.ctx || this.muted) return;
                try {
                    // Двойной звонкий радостный «Тяф-тяф!» для пёсика Батона
                    [0, 0.14].forEach((offset, idx) => {
                        const now = this.ctx.currentTime + offset;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        const startF = idx === 0 ? 520 : 590;
                        osc.frequency.setValueAtTime(startF, now);
                        osc.frequency.exponentialRampToValueAtTime(startF * 1.65, now + 0.045);
                        osc.frequency.exponentialRampToValueAtTime(340, now + 0.11);
                        gain.gain.setValueAtTime(0.001, now);
                        gain.gain.linearRampToValueAtTime(0.08, now + 0.015);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.115);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 0.12);
                    });
                } catch (e) {}
            }
        }

        const sound = new SoundEngine();

        /***********************************************************************
         * СОСТОЯНИЕ ИГРЫ И СЮЖЕТНЫЕ ДАННЫЕ
         ***********************************************************************/
        const GAME_STATE = {
            TITLE: 'TITLE',
            EXPLORE: 'EXPLORE',
            SKETCHBOOK: 'SKETCHBOOK',
            LAPTOP: 'LAPTOP',
            PHOTO_CUTSCENE: 'PHOTO_CUTSCENE',
            BATTLE: 'BATTLE',
            ENDING: 'ENDING'
        };

        let currentState = GAME_STATE.TITLE;
        let currentLocation = 'WHITE_SPACE'; // 'WHITE_SPACE' | 'CORRIDOR' | 'REAL_ROOM'

        // Главная героиня — АНЯ
        const player = {
            x: 400,
            y: 325,
            dir: 'down', // 'down' | 'up' | 'left' | 'right'
            moving: false,
            stepTimer: 0,
            stepFrame: 0,
            speed: 2.7,
            runSpeed: 4.5,
            emotion: 'NEUTRAL' // 'NEUTRAL' (АНЯ) | 'SAD' | 'AFRAID' | 'ANGRY' | 'CALM'
        };

        // Флаги прогресса сюжета
        const flags = {
            inspectedMewo: false,
            inspectedLaptop: false,
            inspectedSketchbook: false,
            inspectedTissues: false,
            inspectedLightbulb: false,
            knifeSpawned: false,
            hasKnife: false,
            doorSpawned: false,
            talkedFriends: 0,
            mewoPetCount: 0,
            batonHeartTimer: 0,
            endingType: null // 'SUPPRESS' | 'ACCEPT'
        };

        // Интерактивные объекты Белого Пространства
        function getWhiteSpaceObjects() {
            const objs = [
                {
                    id: 'lightbulb',
                    name: 'Чёрная лампочка',
                    x: 400,
                    y: 205,
                    radius: 34,
                    solid: false
                },
                {
                    id: 'mewo',
                    name: 'Пёсик БАТОН',
                    x: 298,
                    y: 288,
                    radius: 34,
                    solid: true
                },

            emotion: 'NEUTRAL', // 'NEUTRAL' | 'SAD' | 'AFRAID' | 'ANGRY' | 'CALM'
            choices: null, // [{ label: 'Да', action: () => {} }, ...]

            onFinish: null

        function startDialogue(pages, options = {}) {
            sound.init();
            dialogue.active = true;
            dialogue.pages = pages;
            dialogue.pageIndex = 0;
            dialogue.charIndex = 0;
            dialogue.charTimer = 0;
            dialogue.speaker = options.speaker || '';
            dialogue.portrait = options.portrait !== undefined ? options.portrait : 'OMORI';
            dialogue.emotion = options.emotion || player.emotion || 'NEUTRAL';
            dialogue.choices = options.choices || null;
            dialogue.choiceIndex = 0;
            dialogue.onFinish = options.onFinish || null;

            if (pages[0] && typeof pages[0] === 'object') {
                applyPageConfig(pages[0]);
            }
        }

        function applyPageConfig(pageObj) {
            if (pageObj.speaker !== undefined) dialogue.speaker = pageObj.speaker;
            if (pageObj.portrait !== undefined) dialogue.portrait = pageObj.portrait;
            if (pageObj.emotion !== undefined) {
                dialogue.emotion = pageObj.emotion;
                if (dialogue.portrait === 'OMORI') player.emotion = pageObj.emotion;
            }
        }

        function getCurrentPageText() {
            const p = dialogue.pages[dialogue.pageIndex];
            if (!p) return '';
            return typeof p === 'string' ? p : p.text;
        }

        function advanceDialogue() {
            if (!dialogue.active) return;
            const fullText = getCurrentPageText();

            // Если текст еще печатается — мгновенно показать весь текст
            if (dialogue.charIndex < fullText.length) {
                dialogue.charIndex = fullText.length;
                return;
            }

            // Если это последняя страница и есть выбор
            if (dialogue.pageIndex >= dialogue.pages.length - 1 && dialogue.choices && dialogue.choices.length > 0) {
                const chosen = dialogue.choices[dialogue.choiceIndex];
                sound.playConfirm();
                dialogue.active = false;
                if (chosen && chosen.action) chosen.action();
                return;
            }

            // Переход к следующей реплике
            if (dialogue.pageIndex < dialogue.pages.length - 1) {
                dialogue.pageIndex++;
                dialogue.charIndex = 0;
                const nextP = dialogue.pages[dialogue.pageIndex];
                if (typeof nextP === 'object') {
                    applyPageConfig(nextP);
                }
                sound.playCursor();
            } else {
                // Закрытие диалога
                dialogue.active = false;
                const cb = dialogue.onFinish;
                dialogue.onFinish = null;
                if (cb) cb();
                checkKnifeTrigger();
            }
        }

        function executePlayerBattleAction(actionType, index = 0) {
            if (battle.phase === 'ANIMATING') return;
            battle.phase = 'ANIMATING';
            battle.turnCount++;

            if (actionType === 'ATTACK') {
                sound.playSlash();
                battle.slashAnim = 18;
                battle.enemy.shake = 16;

                let baseDmg = 42 + Math.floor(Math.random() * 14);
                if (battle.omori.emotion === 'ANGRY') baseDmg = Math.floor(baseDmg * 1.55);
                if (battle.omori.emotion === 'SAD') baseDmg = Math.floor(baseDmg * 0.85);
                if (battle.omori.emotion === 'AFRAID') baseDmg = Math.floor(baseDmg * 0.75);

                battle.enemy.hp = Math.max(0, battle.enemy.hp - baseDmg);
                spawnDamagePopup(400 + (Math.random() * 40 - 20), 210, `-${baseDmg}`, '#ef4444');
                battle.logText = `АНЯ наносит решительный удар! ЧТО-ТО теряет ${baseDmg} ОЗ!`;
            } else if (actionType === 'SKILL') {
                const sk = battle.skills[index];
                battle.omori.juice = Math.max(0, battle.omori.juice - sk.cost);

                if (index === 0) {
                    // Успокоиться
                    sound.playHeal();
                    const heal = 35;
                    battle.omori.hp = Math.min(battle.omori.maxHp, battle.omori.hp + heal);
                    battle.omori.emotion = 'NEUTRAL';
                    player.emotion = 'NEUTRAL';
                    spawnDamagePopup(150, 410, `+${heal}`, '#4ade80');
                    battle.logText = 'АНЯ делает глубокий вдох и улыбается. СЕРДЦА восстановлены!';
                } else if (index === 1) {
                    // Печальный стих
                    sound.playHeal();
                    battle.omori.emotion = 'SAD';
                    player.emotion = 'SAD';
                    battle.logText = 'АНЯ вспоминает грустную мелодию... Защита выросла.';
                } else if (index === 2) {
                    // Яростный выпад
                    sound.playSlash();
                    battle.slashAnim = 22;
                    battle.enemy.shake = 22;
                    battle.omori.emotion = 'ANGRY';
                    player.emotion = 'ANGRY';

         ***********************************************************************/

        // Вспомогательная функция рисования 5-конечной звёздочки в карандашном стиле (как на фото Ани)
        function drawHandStar(cx, cy, r, color = '#231f20', seed = 1) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.6;
            ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let i = 0; i <= 5; i++) {
                const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
                const px = cx + Math.cos(a) * r + boilOffset(seed + i, 0.45);
                const py = cy + Math.sin(a) * r + boilOffset(seed + i + 10, 0.45);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        // Вспомогательная функция рисования маленькой карандашной спиральки (как на деревянном фоне фото)
        function drawHandSpiral(cx, cy, maxR, color = '#231f20', seed = 1) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            const steps = 18;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const angle = t * Math.PI * 3.5;
                const r = t * maxR;
                const px = cx + Math.cos(angle) * r + boilOffset(seed + i, 0.25);
                const py = cy + Math.sin(angle) * r + boilOffset(seed + i + 7, 0.25);
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
            ctx.restore();
        }

        // Отрисовка спрайта АНИ в мире (4 направления, длинные тёмные волосы, уютный серый полосатый свитер, румянец)
        function drawOmoriSprite(cx, cy, dir, stepFrame, scale = 1) {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(scale, scale);

            const walkBob = (stepFrame === 1 || stepFrame === 3) ? -2.5 : 0;
            const leftLegOffset = stepFrame === 1 ? -4 : (stepFrame === 3 ? 4 : 0);
            const rightLegOffset = stepFrame === 1 ? 4 : (stepFrame === 3 ? -4 : 0);

            // Тень под ногами
            drawSketchCircle(0, 25, 16, 6, 'rgba(0,0,0,0.22)', null, 1, 77);

            ctx.translate(0, walkBob);

            // Задняя часть длинных тёмных волос (видна за плечами и спиной)
            ctx.fillStyle = '#221f22';
            ctx.strokeStyle = '#110f12';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(-15, -24);
            ctx.quadraticCurveTo(-19, -4, -16 + boilOffset(2, 0.6), 9);
            ctx.lineTo(16 + boilOffset(3, 0.6), 9);
            ctx.quadraticCurveTo(19, -4, 15, -24);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Ножки и тёмные гольфы/ботиночки
            ctx.fillStyle = '#fceee2';
            ctx.strokeStyle = '#181619';
            ctx.lineWidth = 1.8;
            // Левая нога
            ctx.fillRect(-7, 11 + leftLegOffset * 0.5, 5.5, 7);
            ctx.strokeRect(-7, 11 + leftLegOffset * 0.5, 5.5, 7);
            ctx.fillStyle = '#1f1d20';
            ctx.fillRect(-7.5, 16 + leftLegOffset * 0.5, 6, 7);

            // Правая нога
            ctx.fillStyle = '#fceee2';
            ctx.fillRect(1.5, 11 + rightLegOffset * 0.5, 5.5, 7);
            ctx.strokeRect(1.5, 11 + rightLegOffset * 0.5, 5.5, 7);
            ctx.fillStyle = '#1f1d20';
            ctx.fillRect(1.5, 16 + rightLegOffset * 0.5, 6, 7);

            // Тёмная юбочка / шорты под свитером
            ctx.fillStyle = '#27252a';
            ctx.fillRect(-10, 6, 20, 6);
            ctx.strokeRect(-10, 6, 20, 6);

            // Рукава уютного серого полосатого свитера
            const armSwing = (stepFrame === 1 ? 2.5 : (stepFrame === 3 ? -2.5 : 0));
            ctx.fillStyle = '#c8ccd0';
            ctx.strokeStyle = '#1f1d20';
            ctx.lineWidth = 1.8;
            ctx.fillRect(-15, -9 + armSwing, 5.5, 13);
            ctx.strokeRect(-15, -9 + armSwing, 5.5, 13);
            ctx.fillRect(9.5, -9 - armSwing, 5.5, 13);
            ctx.strokeRect(9.5, -9 - armSwing, 5.5, 13);

            // Полоски на рукавах

            if (dir !== 'up') {

                // Мягкие дужки бровей

                ctx.lineTo(-6.5 + faceShiftX, -16.5);

                ctx.arc(0 + faceShiftX, -16.8, 3.2, 0.18 * Math.PI, 0.82 * Math.PI);

            // Длинные тёмные волосы Ани: пышная макушка, чёлка с пробором-галочкой и длинные передние пряди на свитере

                ctx.lineTo(-11, 7);

                ctx.lineTo(-2.5, -28);
                ctx.lineTo(-5, -22);

            ctx.stroke();

            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(2, -39);
            ctx.quadraticCurveTo(6, -44 + boilOffset(6, 0.6), 10, -41);

        // Отрисовка детализированного портрета АНИ по присланному рисунку (для меню, диалогов и боя)
        function drawAnyaDetailedPortrait(x, y, size, emotion) {
            ctx.save();
            const scale = size / 150;
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // 1. ФОН ПОРТРЕТА: Тёплые деревянные доски со штриховкой, спиралями и звёздочками (или фон эмоции в бою)
            if (emotion === 'NEUTRAL' || emotion === 'CALM') {

            ctx.moveTo(-42, -22);

            // Шея с мягкой карандашной тенью под подбородком

        // Отрисовка детализированного портрета пёсика БАТОНА в точности по присланной фотографии
        function drawBatonDetailedPortrait(x, y, size) {
            ctx.save();
            const scale = size / 150;
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // 1. Тёплый кремово-жёлтый бумажный фон с карандашной рамкой, звёздочками ☆ и спиралями @ (как на фото Батона)
            ctx.fillStyle = '#f8e6bd';
            ctx.fillRect(0, 0, 150, 150);

            // Внутренняя двойная рисованная рамка открытки

            ctx.lineWidth = 1.6;
            ctx.strokeRect(5, 5, 140, 140);
            ctx.lineWidth = 0.9;
            ctx.strokeRect(7.5, 7.5, 135, 135);

            // Звёздочки ☆, спиральки @ и штрихи вокруг Батона (как на оригинальном рисунке)
            drawHandStar(18, 20, 6.2, '#2b221e', 901);
            drawHandStar(14, 34, 3.8, '#2b221e', 902);
            drawHandStar(118, 17, 4.5, '#2b221e', 903);
            drawHandStar(131, 66, 5.8, '#2b221e', 904);
            drawHandStar(135, 92, 3.8, '#2b221e', 905);
            drawHandStar(16, 94, 4.0, '#2b221e', 906);
            drawHandStar(19, 108, 5.5, '#2b221e', 907);

            drawHandSpiral(132, 16, 4.5, '#2b221e', 910);

            drawHandSpiral(135, 79, 3.5, '#2b221e', 912);
            drawHandSpiral(134, 106, 4.0, '#2b221e', 913);

            // Боковые лучики-штрихи у щёк Батона
            drawSketchLine(16, 50, 21, 49, '#2b221e', 1.5, 914, 2);
            drawSketchLine(16, 55, 21, 55, '#2b221e', 1.5, 915, 2);
            drawSketchLine(17, 60, 21, 59, '#2b221e', 1.5, 916, 2);

            drawSketchLine(128, 46, 133, 44, '#2b221e', 1.5, 917, 2);
            drawSketchLine(129, 51, 134, 50, '#2b221e', 1.5, 918, 2);
            drawSketchLine(128, 56, 133, 56, '#2b221e', 1.5, 919, 2);

            const bx = 76 + boilOffset(920, 0.5);

            // 2. ОГРОМНЫЕ ПУШИСТЫЕ УШИ-БАБОЧКИ (как у папийона / длинношёрстного чихуахуа на фото)
            // Левое большое мохнатое ухо
            ctx.fillStyle = '#252021';
            ctx.strokeStyle = '#181415';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(bx - 16, by - 22);
            ctx.lineTo(bx - 30, by - 46);
            ctx.lineTo(bx - 48, by - 49 + boilOffset(922, 0.8));
            ctx.lineTo(bx - 52, by - 36);
            ctx.lineTo(bx - 47, by - 20);
            ctx.lineTo(bx - 38, by - 12);
            ctx.lineTo(bx - 24, by - 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Внутренняя бежево-золотистая часть левого уха со штриховкой шерсти
            ctx.fillStyle = '#cda274';
            ctx.beginPath();
            ctx.moveTo(bx - 20, by - 17);
            ctx.lineTo(bx - 36, by - 37);
            ctx.lineTo(bx - 42, by - 26);
            ctx.lineTo(bx - 27, by - 12);
            ctx.closePath();
            ctx.fill();

            // Пушистые очёсы по краям левого уха
            for (let i = 0; i < 6; i++) {
                drawSketchLine(bx - 28 - i * 3.5, by - 22 - i * 4, bx - 53 + i * 1.5, by - 16 - i * 5.5, '#1f1a1b', 1.7, 925 + i, 2);

            // Правое большое мохнатое ухо
            ctx.fillStyle = '#252021';
            ctx.beginPath();
            ctx.moveTo(bx + 14, by - 22);
            ctx.lineTo(bx + 28, by - 46);
            ctx.lineTo(bx + 49, by - 48 + boilOffset(923, 0.8));
            ctx.lineTo(bx + 51, by - 33);
            ctx.lineTo(bx + 45, by - 18);
            ctx.lineTo(bx + 36, by - 10);
            ctx.lineTo(bx + 22, by - 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Внутренняя бежево-золотистая часть правого уха
            ctx.fillStyle = '#cda274';
            ctx.beginPath();
            ctx.moveTo(bx + 18, by - 17);
            ctx.lineTo(bx + 35, by - 36);
            ctx.lineTo(bx + 41, by - 24);
            ctx.lineTo(bx + 25, by - 12);

                drawSketchLine(bx + 26 + i * 3.5, by - 22 - i * 4, bx + 52 - i * 1.5, by - 15 - i * 5.5, '#1f1a1b', 1.7, 932 + i, 2);

            // 3. ПУШИСТОЕ ЧЁРНО-БЕЛОЕ ТЕЛЬЦЕ И ПЫШНАЯ БЕЛАЯ МАНИШКА НА ГРУДИ
            // Тёмно-чёрная пушистая спинка и бока со штриховкой

            ctx.lineTo(bx + 39, by + 26);
            ctx.lineTo(bx + 27, by + 6);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Пышный белый воротник-грудка с карандашными зубчиками шерсти
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#231f20';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(bx - 26, by + 4);
            ctx.lineTo(bx - 34, by + 9);
            ctx.lineTo(bx - 27, by + 15);
            ctx.lineTo(bx - 21, by + 33);
            ctx.lineTo(bx - 8, by + 45);
            ctx.lineTo(bx + 10, by + 45);
            ctx.lineTo(bx + 20, by + 25);
            ctx.lineTo(bx + 30, by + 13);
            ctx.lineTo(bx + 24, by + 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Мягкие бежевые и серые штрихи пушистой шерсти на грудке
            ctx.strokeStyle = '#cbb299';
            ctx.lineWidth = 1.2;
            [-14, -7, 0, 7, 13].forEach((fx, i) => {
                ctx.beginPath();
                ctx.moveTo(bx + fx, by + 14);
                ctx.lineTo(bx + fx + (i % 2 === 0 ? -2 : 2), by + 27);

            });

            // 4. ПОДНЯТАЯ ВВЕРХ ЛЕВАЯ БЕЛАЯ ЛАПКА С ТЁМНЫМИ ПОДУШЕЧКАМИ (приветственный жест с фото!)
            const pawWave = Math.sin(Date.now() / 240) * 1.8;
            ctx.save();
            ctx.translate(bx - 24, by + 22);
            ctx.rotate(-0.12 + pawWave * 0.03);

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#231f20';
            ctx.lineWidth = 1.7;
            ctx.beginPath();
            ctx.moveTo(4, 6);

            ctx.quadraticCurveTo(-6, -12, 8, -4);

            ctx.fill();
            ctx.stroke();

            // Округлая ладошка лапки с пальчиками
            drawSketchCircle(-19, -16, 6.2, 5.5, '#fdf6ee', '#231f20', 1.6, 940);

            // Милые тёмно-коричневые подушечки лапки (toe beans, как на фото!)
            ctx.fillStyle = '#2a211d';
            // Главная центральная подушечка
            ctx.beginPath();
            ctx.ellipse(-18, -14.2, 2.3, 1.8, -0.3, 0, Math.PI * 2);
            ctx.fill();
            // 4 маленьких пальчика-подушечки полукругом сверху
            [
                { dx: -22.2, dy: -16.2 },

                { dx: -17.8, dy: -18.8 },
                { dx: -15.5, dy: -17.0 }
            ].forEach((bean) => {
                ctx.beginPath();
                ctx.arc(bean.dx, bean.dy, 1.15, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // 5. ГОЛОВА БАТОНА (триколор: чёрная шапочка, белая полоска на лбу, бежевые бровки и щёчки)
            // Основной пушистый чёрный контур головы
            ctx.fillStyle = '#241f20';
            ctx.strokeStyle = '#161213';
            ctx.lineWidth = 1.8;
            drawSketchCircle(bx - 1, by - 9, 25, 19, '#241f20', '#161213', 1.8, 945);

            // Пушистые щёчки-кисточки по бокам мордочки
            ctx.beginPath();
            ctx.moveTo(bx - 23, by - 12);

            ctx.lineTo(bx - 26, by - 3);
            ctx.lineTo(bx - 33, by + 2);
            ctx.lineTo(bx - 21, by + 4);
            ctx.moveTo(bx + 21, by - 12);
            ctx.lineTo(bx + 34, by - 7);
            ctx.lineTo(bx + 25, by - 3);
            ctx.lineTo(bx + 32, by + 2);
            ctx.lineTo(bx + 20, by + 4);
            ctx.fill();
            ctx.stroke();

            // Бежево-рыжие подпалины на щёчках под глазами (триколор окрас с фото)
            ctx.fillStyle = '#dfb384';
            ctx.beginPath();
            ctx.ellipse(bx - 15, by + 1, 8, 4.2, 0.2, 0, Math.PI * 2);
            ctx.ellipse(bx + 14, by + 1, 8, 4.2, -0.2, 0, Math.PI * 2);

            // Вертикальная белая проточина (полоска) по центру лба, переходящая в белую мордочку

            // Две характерные бежевые «бровки»-пятнышки над глазами (как на фото!)

            ctx.beginPath();
            ctx.ellipse(bx - 9.5, by - 16.5, 4.2, 2.3, 0.35, 0, Math.PI * 2);
            ctx.ellipse(bx + 8.5, by - 16.5, 4.2, 2.3, -0.35, 0, Math.PI * 2);

            // Огромные круглые блестящие тёмные глаза Батона

            // Яркие круглые белые блики в глазах
            ctx.fillStyle = '#ffffff';

            // Маленький чёрный носик-пуговка и крошечный приоткрытый ротик треугольничком △

            // 6. ЧЕЛОВЕЧЕСКАЯ ЛАДОНЬ С СЕРЫМ РУКАВОМ СНИЗУ, НА КОТОРОЙ СИДИТ БАТОН (в точности с фото!)
            // Тёплая бежево-персиковая ладонь, поддерживающая Батона
            ctx.fillStyle = '#fce0c5';

            ctx.lineTo(72, 125);

            ctx.quadraticCurveTo(110, 129, 92, 136);

        // Отрисовка пёсика БАТОНА в Белом Пространстве (оверворлд-спрайт)
        function drawBatonOverworld(x, y) {
            ctx.save();
            ctx.translate(x, y);

            // Мягкая тень на коврике
            drawSketchCircle(0, 16, 20, 7, 'rgba(0,0,0,0.16)', null, 1, 960);

            // Ладонь-подушечка под Батоном
            drawSketchCircle(0, 11, 18, 7, '#fce0c5', '#181415', 1.6, 961);

            // Пушистый виляющий хвостик справа
            const tailWag = Math.sin(Date.now() / 190) * 5;
            drawSketchLine(13, 4, 24, -5 + tailWag, '#231f20', 4, 962, 3);
            drawSketchLine(14, 4, 23, -3 + tailWag, '#ffffff', 2, 963, 2);

            // Чёрно-белое пушистое тельце и белая грудка
            drawSketchCircle(0, 3, 14, 11, '#231f20', '#181415', 1.8, 964);
            drawSketchCircle(-1, 5, 10, 8.5, '#ffffff', '#231f20', 1.4, 965);

            // Поднятая белая приветственная лапка слева с тёмной подушечкой
            const waveY = Math.sin(Date.now() / 220) * 2;
            drawSketchCircle(-15, -1 + waveY, 4.5, 3.8, '#ffffff', '#231f20', 1.5, 966);
            ctx.fillStyle = '#2a211d';
            ctx.beginPath();
            ctx.arc(-15.5, -1 + waveY, 1.5, 0, Math.PI * 2);
            ctx.fill();

            // Огромные пушистые уши-бабочки
            ctx.fillStyle = '#231f20';
            ctx.strokeStyle = '#141112';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            // Левое ухо
            ctx.moveTo(-7, -12);
            ctx.lineTo(-22, -26 + boilOffset(967, 0.7));
            ctx.lineTo(-24, -14);
            ctx.lineTo(-12, -5);
            // Правое ухо
            ctx.moveTo(7, -12);
            ctx.lineTo(22, -26 + boilOffset(968, 0.7));
            ctx.lineTo(24, -14);
            ctx.lineTo(12, -5);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Бежевая серединка ушей
            ctx.fillStyle = '#cda274';
            ctx.beginPath();
            ctx.arc(-15, -15, 3.5, 0, Math.PI * 2);
            ctx.arc(15, -15, 3.5, 0, Math.PI * 2);
            ctx.fill();

            // Голова Батона с белой полоской на лбу и бежевыми бровками
            drawSketchCircle(0, -8, 12, 9.5, '#231f20', '#141112', 1.8, 969);
            // Белая полоска и мордочка
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-2, -17, 4, 9);
            drawSketchCircle(0, -5, 5.2, 4.2, '#ffffff', null, 1, 970);

            // Бежевые бровки и щёчки
            ctx.fillStyle = '#e0b382';
            ctx.beginPath();
            ctx.arc(-5, -12.5, 2, 0, Math.PI * 2);
            ctx.arc(5, -12.5, 2, 0, Math.PI * 2);
            ctx.fill();

            // Большие круглые тёмные глазки с белыми бликами
            ctx.fillStyle = '#141112';
            ctx.beginPath();
            ctx.arc(-5.5, -8.5, 3.2, 0, Math.PI * 2);
            ctx.arc(5.5, -8.5, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-6.2, -9.2, 1.1, 0, Math.PI * 2);
            ctx.arc(4.8, -9.2, 1.1, 0, Math.PI * 2);
            ctx.fill();

            // Чёрный носик
            ctx.fillStyle = '#141112';
            ctx.beginPath();
            ctx.arc(0, -5.8, 1.4, 0, Math.PI * 2);
            ctx.fill();

            // Если Батона погладили — рисуем парящее сердечко над ним
            if (flags.batonHeartTimer > 0) {
                flags.batonHeartTimer--;
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 16px "Comfortaa", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('♥', 0, -28 - (60 - flags.batonHeartTimer) * 0.2);
            }

            ctx.restore();
        }

        // Отрисовка крупного портрета персонажа в квадратном окне над диалогом, в меню или в бою
        function drawPortraitBox(x, y, size, portraitType, emotion) {
            // Основная коробка портрета
            drawOmoriBox(x, y, size, size, {
                fill: '#08080a',
                border: '#ffffff',
                doubleBorder: true,
                seed: 88
            });

            ctx.save();
            // Обрезка внутри рамки
            ctx.beginPath();
            ctx.rect(x + 6, y + 6, size - 12, size - 12);
            ctx.clip();

            const cx = x + size / 2;
            const cy = y + size / 2 + 8;

            if (portraitType === 'OMORI' || portraitType === 'SUNNY' || portraitType === 'ANYA') {
                // Отрисовка портрета Ани с присланной фотографии
                drawAnyaDetailedPortrait(x + 6, y + 6, size - 12, emotion);
            } else if (portraitType === 'MEWO' || portraitType === 'BATON') {
                // Детализированный портрет пёсика БАТОНА с присланной фотографии
                drawBatonDetailedPortrait(x + 6, y + 6, size - 12);
            } else if (portraitType === 'SOMETHING' || portraitType === 'SHADOW') {
                ctx.fillStyle = '#070709';
                ctx.fillRect(0, y, size, size);
                // Портрет ЧТО-ТО В ТЕМНОТЕ
                ctx.save();
                ctx.translate(cx + boilOffset(55, 2.2), cy + boilOffset(56, 2.2));
                drawSketchCircle(0, 0, 24, 36, '#050507', '#ffffff', 2, 97);
                // Один огромный смотрящий глаз
                drawSketchCircle(0, -6, 13, 9, '#ffffff', '#ef4444', 2, 98);
                drawSketchCircle(0, -6, 4.5, 4.5, '#050507', '#ffffff', 1.5, 99);
                ctx.restore();
            }

            ctx.restore();

            // Плашка эмоции сверху рамки портрета: по умолчанию просто «АНЯ»
            const emotionLabels = {
                NEUTRAL: { text: 'АНЯ',       bg: '#18181b', border: '#ffffff' },
                CALM:    { text: 'СПОКОЙНАЯ', bg: '#0c4a6e', border: '#38bdf8' },
                SAD:     { text: 'ГРУСТНАЯ',  bg: '#1e3a8a', border: '#60a5fa' },
                ANGRY:   { text: 'ЗЛАЯ',      bg: '#7f1d1d', border: '#ef4444' },
                AFRAID:  { text: 'В УЖАСЕ',   bg: '#450a0a', border: '#f87171' }
            };
            const badge = emotionLabels[emotion] || emotionLabels.NEUTRAL;
            const isBaton = portraitType === 'MEWO' || portraitType === 'BATON';
            const badgeText = isBaton ? 'БАТОН' : (portraitType === 'SOMETHING' ? 'ЧТО-ТО' : badge.text);

            drawOmoriBox(x + 4, y - 16, size - 8, 24, {
                fill: badge.bg,
                border: badge.border,
                doubleBorder: false,
                seed: 104,
                boilAmp: 0.9
            });
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 11px "Comfortaa", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(badgeText, x + size / 2, y - 3);
            ctx.restore();
        }

        // Отрисовка ЧТО-ТО В ТЕМНОТЕ (SOMETHING)
        function drawSomethingEntity(cx, cy, scale = 1, shake = 0) {
            ctx.save();
            const sx = shake > 0 ? (Math.random() - 0.5) * shake : boilOffset(11, 2.5);
            const sy = shake > 0 ? (Math.random() - 0.5) * shake : boilOffset(12, 2.5);
            ctx.translate(cx + sx, cy + sy);
            ctx.scale(scale, scale);

            // Внешняя тревожная аура из дрожащих линий
            for (let i = 0; i < 6; i++) {
                const radX = 48 + i * 4 + boilOffset(i * 7, 3);
                const radY = 85 + i * 5 + boilOffset(i * 9, 3);
                drawSketchCircle(0, 0, radX, radY, null, i % 2 === 0 ? 'rgba(239,68,68,0.28)' : 'rgba(0,0,0,0.45)', 1.5, i * 19);
            }

            // Вытянутый каплевидный чёрный силуэт с тремя волнистыми «прядьями» внизу
            ctx.fillStyle = '#050507';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(0, -82 + boilOffset(1, 2));
            ctx.bezierCurveTo(52, -70, 56, 20, 42, 75 + boilOffset(2, 2));
            ctx.lineTo(22, 52);
            ctx.lineTo(6, 82 + boilOffset(3, 2));
            ctx.lineTo(-10, 52);
            ctx.lineTo(-28, 78 + boilOffset(4, 2));
            ctx.bezierCurveTo(-56, 20, -52, -70, 0, -82 + boilOffset(1, 2));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Единственный огромный глаз в центре с вертикальными линиями вокруг
            drawSketchCircle(0, -16, 24, 15, '#ffffff', '#050507', 2.5, 201);
            drawSketchCircle(
                boilOffset(31, 2.5),
                -16 + boilOffset(32, 1.8),
                8.5,
                8.5,
                '#050507',
                '#ef4444',
                2,
                202
            );
            // Блик в зрачке
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-2.5, -18.5, 2.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Отрисовка КРАСНЫХ РУК (Red Hands)
        function drawRedHand(x, y, angle, scale = 1, seed = 1) {
            ctx.save();
            ctx.translate(x + boilOffset(seed, 2), y + boilOffset(seed + 1, 2));
            ctx.rotate(angle);
            ctx.scale(scale, scale);

            ctx.fillStyle = '#09090b';
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 2.4;

            // Длинное запястье и ладонь с длинными пальцами
            ctx.beginPath();
            ctx.moveTo(-14, 90);
            ctx.lineTo(-12, 12);
            // 5 длинных изломанных пальцев
            ctx.lineTo(-28, -12 + boilOffset(seed + 2, 2));
            ctx.lineTo(-16, -2);
            ctx.lineTo(-18, -36 + boilOffset(seed + 3, 2));
            ctx.lineTo(-6, -8);
            ctx.lineTo(-2, -44 + boilOffset(seed + 4, 2));
            ctx.lineTo(6, -8);
            ctx.lineTo(16, -35 + boilOffset(seed + 5, 2));
            ctx.lineTo(14, -2);
            ctx.lineTo(28, -16 + boilOffset(seed + 6, 2));
            ctx.lineTo(12, 14);
            ctx.lineTo(14, 90);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        /***********************************************************************
         * ЛОКАЦИЯ 1: БЕЛОЕ ПРОСТРАНСТВО (WHITE SPACE)
         ***********************************************************************/
        function drawWhiteSpace() {
            // Бесконечный белый фон
            ctx.fillStyle = '#f8f8f6';
            ctx.fillRect(0, 0, W, H);

            // Едва заметные карандашные пылинки в пустоте
            ctx.fillStyle = 'rgba(0,0,0,0.08)';
            for (let i = 0; i < 18; i++) {
                const px = (i * 137 + boilFrame * 3) % W;
                const py = (i * 89 + boilFrame * 2) % H;
                ctx.fillRect(px, py, 2, 2);
            }

            // Центральный коврик (прямоугольная зона жизни Омори)
            const matX = 240, matY = 200, matW = 320, matH = 220;
            drawOmoriBox(matX, matY, matW, matH, {
                fill: '#ffffff',
                border: '#0a0a0d',
                doubleBorder: true,
                seed: 15,
                boilAmp: 1.4
            });

            // Декоративная бахрома по краям коврика
            for (let by = matY + 12; by < matY + matH - 8; by += 14) {
                drawSketchLine(matX - 8, by, matX, by, '#0a0a0d', 1.5, by, 2);
                drawSketchLine(matX + matW, by, matX + matW + 8, by, '#0a0a0d', 1.5, by + 5, 2);
            }

            // 1. ПЁСИК БАТОН (сидит на ладони и машет лапкой)
            drawBatonOverworld(298, 288);

            // 2. НОУТБУК
            const lapX = 340, lapY = 235;
            // Основание
            drawOmoriBox(lapX - 20, lapY, 40, 14, { fill: '#d4d4d8', border: '#0a0a0d', doubleBorder: false, seed: 40, boilAmp: 0.9 });
            // Экран ноутбука с тёплым статичным шумом
            drawOmoriBox(lapX - 18, lapY - 22, 36, 22, { fill: '#18181b', border: '#0a0a0d', doubleBorder: false, seed: 41, boilAmp: 0.9 });
            ctx.fillStyle = boilFrame % 2 === 0 ? '#e4e4e7' : '#a1a1aa';
            ctx.fillRect(lapX - 13, lapY - 17, 26, 12);
            drawSketchLine(lapX - 10, lapY - 13, lapX + 8, lapY - 13, '#0a0a0d', 1.4, 42, 2);
            drawSketchLine(lapX - 10, lapY - 9, lapX + 4, lapY - 9, '#0a0a0d', 1.4, 43, 2);

            // 3. АЛЬБОМ ДЛЯ РИСОВАНИЯ (SKETCHBOOK)
            const skX = 465, skY = 245;
            drawOmoriBox(skX - 18, skY - 14, 36, 28, { fill: '#ffffff', border: '#0a0a0d', doubleBorder: false, seed: 50, boilAmp: 1.0 });
            // Пружинка альбома сверху и маленький рисунок на обложке
            for (let s = -14; s <= 14; s += 7) {
                drawSketchLine(skX + s, skY - 17, skX + s, skY - 11, '#0a0a0d', 2, 51 + s, 2);
            }
            drawSketchCircle(skX, skY, 7, 7, null, '#ef4444', 1.8, 52);

            // 4. КОРОБКА САЛФЕТОК
            const tisX = 475, tisY = 325;
            drawOmoriBox(tisX - 16, tisY - 10, 32, 20, { fill: '#ffffff', border: '#0a0a0d', doubleBorder: false, seed: 60, boilAmp: 0.9 });
            // Торчащая белая салфетка
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#0a0a0d';
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(tisX - 6, tisY - 6);
            ctx.quadraticCurveTo(tisX - 10, tisY - 24, tisX, tisY - 20 + boilOffset(61, 1.5));
            ctx.quadraticCurveTo(tisX + 10, tisY - 24, tisX + 6, tisY - 6);
            ctx.fill();
            ctx.stroke();

            // 5. БЛЕСТЯЩИЙ НОЖ (появляется после осмотра предметов)
            if (flags.knifeSpawned && !flags.hasKnife) {
                const knX = 270, knY = 385;
                ctx.save();
                ctx.translate(knX, knY);
                // Рукоять
                ctx.fillStyle = '#0a0a0d';
                ctx.fillRect(-14, -3, 10, 6);
                // Лезвие
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#0a0a0d';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-4, -5);
                ctx.lineTo(16, 0);
                ctx.lineTo(-4, 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                // Пульсирующая звёздочка блеска
                const glint = 4 + (boilFrame % 3) * 2.5;
                drawSketchLine(6, -10 - glint, 6, -10 + glint, '#ef4444', 2, 70, 2);
                drawSketchLine(6 - glint, -10, 6 + glint, -10, '#ef4444', 2, 71, 2);
                ctx.restore();
            }

            // 6. БЕЛАЯ ДВЕРЬ С ТЕНЬЮ (появляется после взятия ножа)
            if (flags.doorSpawned) {
                const dX = 400, dY = 468;
                // Длинная слабая тень от двери
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                ctx.beginPath();
                ctx.moveTo(dX - 24, dY + 12);
                ctx.lineTo(dX + 24, dY + 12);
                ctx.lineTo(dX + 44, dY + 64);
                ctx.lineTo(dX - 44, dY + 64);
                ctx.closePath();
                ctx.fill();

                // Полотно Белой Двери
                drawOmoriBox(dX - 24, dY - 56, 48, 68, {
                    fill: '#ffffff',
                    border: '#0a0a0d',
                    doubleBorder: true,
                    seed: 75,
                    boilAmp: 1.1
                });
                // Филёнки двери и ручка
                ctx.strokeStyle = '#0a0a0d';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(dX - 15, dY - 46, 30, 20);
                ctx.strokeRect(dX - 15, dY - 18, 30, 20);
                drawSketchCircle(dX + 14, dY - 21, 3, 3, '#0a0a0d', '#0a0a0d', 1, 76);
            }

            // Сортировка по Y: рисуем Омори
            drawOmoriSprite(player.x, player.y, player.dir, player.moving ? player.stepFrame : 0, 1.1);

            // 7. ЧЁРНАЯ ЛАМПОЧКА НА ПРОВОДЕ (свисает сверху поверх сцены)
            const bulbX = 400, bulbY = 175;
            // Тень на полу под лампочкой
            drawSketchCircle(400, 212, 16, 6, 'rgba(0,0,0,0.16)', null, 1, 80);
            // Длинный чёрный провод с потолка
            drawSketchLine(bulbX, 0, bulbX, bulbY - 16, '#0a0a0d', 3, 81, 6);
            // Цоколь
            ctx.fillStyle = '#27272a';
            ctx.strokeStyle = '#0a0a0d';
            ctx.lineWidth = 2;
            ctx.fillRect(bulbX - 6, bulbY - 18, 12, 8);
            ctx.strokeRect(bulbX - 6, bulbY - 18, 12, 8);
            // Колба Чёрной Лампочки
            drawSketchCircle(bulbX, bulbY, 15, 17, '#050507', '#0a0a0d', 2.5, 82);
            // Белая спираль внутри тьмы
            drawSketchLine(bulbX - 4, bulbY - 5, bulbX, bulbY + 4, '#ffffff', 1.5, 83, 2);
            drawSketchLine(bulbX, bulbY + 4, bulbX + 4, bulbY - 5, '#ffffff', 1.5, 84, 2);

            // Тонкая подсказка прогресса в углу Белого Пространства
            ctx.save();
            ctx.fillStyle = '#0a0a0d';
            ctx.font = 'bold 13px "Comfortaa", sans-serif';
            ctx.textAlign = 'left';
            let questHint = `Осмотрено предметов: ${Math.min(3, countInspectedItems())} / 3`;
            if (flags.knifeSpawned && !flags.hasKnife) questHint = 'Подойди и подними БЛЕСТЯЩИЙ НОЖ [Z]';
            if (flags.hasKnife) questHint = 'Открой БЕЛУЮ ДВЕРЬ внизу комнаты [Z]';
            ctx.fillText(`✦ ${questHint}`, 18, 28);
            ctx.restore();
        }

        /***********************************************************************
         * ЛОКАЦИЯ 2: КОРИДОР ВОСПОМИНАНИЙ / СОСЕДНЯЯ КОМНАТА (DREAMWORLD)
         ***********************************************************************/
        function drawCorridorLocation() {
            // Пастельно-пурпурный / тёмно-фиолетовый градиент мира снов, темнеющий к северу (к фотографии)
            const distToPhoto = Math.max(0, Math.min(1, (player.y - 180) / 320));
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#12091c');
            grad.addColorStop(0.5, '#2e1647');
            grad.addColorStop(1, '#4c2673');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Ковровая дорожка Коридора Воспоминаний
            drawOmoriBox(210, 90, 380, 460, {
                fill: '#1e1030',
                border: '#c084fc',
                doubleBorder: true,
                seed: 120,
                boilAmp: 1.5
            });

            // Шахматный узор пастельных плит в центре
            ctx.fillStyle = 'rgba(192, 132, 252, 0.08)';
            for (let y = 110; y < 530; y += 40) {
                for (let x = 230; x < 570; x += 40) {
                    if (((x + y) / 40) % 2 === 0) {
                        ctx.fillRect(x, y, 40, 40);
                    }
                }
            }

            // 1. Белая дверь назад (внизу)
            drawOmoriBox(400 - 22, 515 - 48, 44, 60, {
                fill: '#ffffff',
                border: '#0a0a0d',
                doubleBorder: true,
                seed: 125
            });

            // 2. Силуэты друзей слева (Кел, Обри, Хиро) — пастельно-призрачные фигуры
            const frX = 265, frY = 340;
            drawSketchCircle(frX, frY + 14, 34, 10, 'rgba(192,132,252,0.2)', null, 1, 130);
            // Три призрачных силуэта
            const offsets = [{ dx: -18, dy: 0 }, { dx: 0, dy: -12 }, { dx: 18, dy: 2 }];
            offsets.forEach((o, idx) => {
                drawSketchCircle(frX + o.dx, frY + o.dy - 16, 10, 10, 'rgba(233, 213, 255, 0.25)', '#e9d5ff', 1.8, 131 + idx);
                drawOmoriBox(frX + o.dx - 8, frY + o.dy - 5, 16, 20, {
                    fill: 'rgba(233, 213, 255, 0.18)',
                    border: '#e9d5ff',
                    doubleBorder: false,
                    seed: 135 + idx
                });
            });

            // 3. Силуэт пианино и окна справа (память о Мари)
            const piX = 535, piY = 315;
            drawOmoriBox(piX - 28, piY - 22, 56, 38, {
                fill: '#09090b',
                border: '#e9d5ff',
                doubleBorder: false,
                seed: 140
            });
            // Клавиши пианино
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(piX - 22, piY + 2, 44, 9);
            for (let k = -18; k <= 18; k += 6) {
                ctx.fillStyle = '#09090b';
                ctx.fillRect(piX + k, piY + 2, 3, 5);
            }

            // 4. ВЫПАВШАЯ ФОТОГРАФИЯ (Polaroid) в луче света вверху коридора
            const phX = 400, phY = 175;
            // Луч света сверху
            const beam = ctx.createRadialGradient(phX, phY, 6, phX, phY, 68);
            beam.addColorStop(0, 'rgba(255,255,255,0.45)');
            beam.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = beam;
            ctx.beginPath();
            ctx.arc(phX, phY, 68, 0, Math.PI * 2);
            ctx.fill();

            // Рамка Полароида
            drawOmoriBox(phX - 16, phY - 18, 32, 36, {
                fill: '#ffffff',
                border: '#0a0a0d',
                doubleBorder: false,
                seed: 145
            });
            ctx.fillStyle = '#18181b';
            ctx.fillRect(phX - 12, phY - 14, 24, 20);

            // Отрисовка ОМОРИ
            drawOmoriSprite(player.x, player.y, player.dir, player.moving ? player.stepFrame : 0, 1.1);

            // Если игрок подходит близко к фотографии — по краям экрана тянутся КРАСНЫЕ РУКИ!
            const coolness = Math.max(0, 1 - distToPhoto);
            if (coolness > 0.25) {
                const reach = (coolness - 0.25) * 140;
                drawRedHand(80 + reach, 150, 1.2, 0.9, 1);
                drawRedHand(720 - reach, 150, -1.2, 0.9, 10);
                drawRedHand(90 + reach * 0.8, 340, 1.4, 0.85, 20);
                drawRedHand(710 - reach * 0.8, 340, -1.4, 0.85, 30);

                // Красная тревожная виньетка
                ctx.fillStyle = `rgba(220, 38, 38, ${(coolness - 0.25) * 0.28})`;
                ctx.fillRect(0, 0, W, H);
            }

            ctx.save();
            ctx.fillStyle = '#f3e8ff';
            ctx.font = 'bold 13px "Comfortaa", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('✦ Иди вперёд по коридору и осмотри ВЫПАВШУЮ ФОТОГРАФИЮ [Z]', 18, 28);
            ctx.restore();
        }

        /***********************************************************************
         * ЭКРАН 3: ИНТЕРАКТИВНЫЙ ПРОСМОТР АЛЬБОМА ДЛЯ РИСОВАНИЯ
         ***********************************************************************/
        function drawSketchbookModal() {
            drawWhiteSpace();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
            ctx.fillRect(0, 0, W, H);

            // Лист альбома по центру
            const bx = 130, by = 55, bw = 540, bh = 385;
            drawOmoriBox(bx, by, bw, bh, {
                fill: '#f8f8f6',
                border: '#0a0a0d',
                doubleBorder: true,
                seed: 210,
                boilAmp: 1.5
            });

            // Спираль альбома сверху
            for (let x = bx + 35; x < bx + bw - 30; x += 28) {
                drawSketchCircle(x, by, 5, 11, '#18181b', '#0a0a0d', 2, x);
            }

            const cx = bx + bw / 2;
            const cy = by + bh / 2;

            // Рисунки на страницах альбома
            if (sketchbookPage === 0) {
                // Страница 1: Крупный цветной карандашный портрет пёсика БАТОНА на ладони
                drawBatonDetailedPortrait(cx - 145, by + 34, 290);
            } else if (sketchbookPage === 1) {
                // Страница 2: Портрет Ани в тёплых тонах
                drawAnyaDetailedPortrait(cx - 145, by + 34, 290, 'NEUTRAL');
            } else if (sketchbookPage === 2) {
                // Страница 3: Красные руки вокруг маленькой Ани
                drawOmoriSprite(cx, cy + 15, 'down', 0, 1.0);
                drawRedHand(cx - 160, cy - 60, 1.1, 1.1, 40);
                drawRedHand(cx + 160, cy - 60, -1.1, 1.1, 50);
                drawRedHand(cx - 150, cy + 80, 1.9, 1.0, 60);
                drawRedHand(cx + 150, cy + 80, -1.9, 1.0, 70);
            } else if (sketchbookPage === 3) {
                // Страница 4: Крупный план ЧТО-ТО В ТЕМНОТЕ
                drawSomethingEntity(cx, cy + 5, 1.15, 0);
            }

            // Текстовое описание страницы внизу в стиле OMORI
            const pageData = sketchbookDrawings[sketchbookPage];
            drawOmoriBox(60, 455, 680, 125, {
                fill: '#08080a',
                border: '#ffffff',
                doubleBorder: true,
                seed: 220
            });

            ctx.save();
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 15px "Comfortaa", sans-serif';
            ctx.fillText(`${pageData.title}  (${sketchbookPage + 1} / ${sketchbookDrawings.length})`, 88, 485);

            ctx.fillStyle = '#ffffff';
            ctx.font = '15px "Comfortaa", sans-serif';
            wrapText(ctx, pageData.caption, 88, 514, 620, 22);

            ctx.fillStyle = '#a1a1aa';
            ctx.font = 'bold 12px "Comfortaa", sans-serif';
            ctx.fillText('◀ [ВЛЕВО / ВПРАВО] Листать страницы   |   [Z / X / ESC] Закрыть альбом', 88, 564);
            ctx.restore();
        }

        /***********************************************************************
         * ЭКРАН 4: ПОЛНОЦЕННАЯ БОЕВАЯ СЦЕНА OMORI
         ***********************************************************************/
        function drawBattleScene() {
            ctx.save();
            if (battle.screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * battle.screenShake, (Math.random() - 0.5) * battle.screenShake);
                battle.screenShake = Math.max(0, battle.screenShake - 1);
            }

            // Сюрреалистичный тёмно-багровый фон битвы с карандашными спиралями
            ctx.fillStyle = '#070709';
            ctx.fillRect(0, 0, W, H);

            // Тревожные фоновые круги и линии
            for (let r = 60; r < 420; r += 55) {
                drawSketchCircle(400, 225, r * 1.3, r * 0.85, null, 'rgba(239, 68, 68, 0.16)', 1.5, r);
            }

            // Парящие Красные Руки по углам боевой арены
            drawRedHand(95, 175 + Math.sin(Date.now() / 400) * 10, 1.15, 0.95, 11);
            drawRedHand(705, 175 + Math.cos(Date.now() / 400) * 10, -1.15, 0.95, 22);

            // Враг в центре: ЧТО-ТО В ТЕМНОТЕ
            const swayY = Math.sin(Date.now() / 500) * 7;
            drawSomethingEntity(400, 230 + swayY, 1.25, battle.enemy.shake);
            if (battle.enemy.shake > 0) battle.enemy.shake--;

            // Полоска здоровья врага над ним
            const eBarW = 240, eBarH = 18, eBarX = 400 - eBarW / 2, eBarY = 92;
            drawOmoriBox(eBarX - 4, eBarY - 4, eBarW + 8, eBarH + 8, {
                fill: '#08080a',
                border: '#ffffff',
                doubleBorder: false,
                seed: 301
            });
            const hpRatio = Math.max(0, battle.enemy.hp / battle.enemy.maxHp);

        /***********************************************************************
         * ОТРИСОВКА ИНТЕРФЕЙСА ДИАЛОГА OMORI И ВСПОМОГАТЕЛЬНЫХ ЭЛЕМЕНТОВ
         ***********************************************************************/
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let curY = y;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line, x, curY);
                    line = words[n] + ' ';
                    curY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, curY);
        }

            if (!dialogue.active) return;

            const boxX = 36, boxY = 426, boxW = 728, boxH = 152;

            // Квадратное окно портрета справа НАД диалоговым окном (фирменный стиль OMORI)

            }

            // Плашка говорящего слева над диалогом (если указана)
            if (dialogue.speaker) {
                drawOmoriBox(boxX, boxY - 38, 210, 34, {
                    fill: '#08080a',
                    border: '#ffffff',
                    doubleBorder: false,
                    seed: 401
                });
                ctx.save();

                ctx.fillText(dialogue.speaker, boxX + 16, boxY - 16);

            // Основное чёрное диалоговое окно с двойной рисованной белой рамкой

                fill: '#08080a',

            });

            // Вывод текста по буквам
            const fullText = getCurrentPageText();
            const visibleText = fullText.slice(0, Math.floor(dialogue.charIndex));

            ctx.save();

            // Если это последняя страница и есть варианты выбора — рисуем окно выбора слева над диалогом
            if (dialogue.charIndex >= fullText.length && dialogue.pageIndex === dialogue.pages.length - 1 && dialogue.choices) {
                const chW = 340;

                });
            }

            // Прыгающая белая/красная стрелочка продолжения в правом нижнем углу диалога
            if (dialogue.charIndex >= fullText.length) {
                const bounce = Math.sin(Date.now() / 160) * 4;
                const ax = boxX + boxW - 28;

                ctx.beginPath();

                ctx.lineTo(ax + 7, ay - 5);
                ctx.lineTo(ax, ay + 6);
                ctx.closePath();
                ctx.fill();
            }

            ctx.restore();
        }

        /***********************************************************************
         * ВЗАИМОДЕЙСТВИЕ С ОБЪЕКТАМИ В МИРЕ
         ***********************************************************************/
        function getClosestInteractable() {
            const list = currentLocation === 'WHITE_SPACE' ? getWhiteSpaceObjects() : getCorridorObjects();
            let best = null;
            let bestDist = 56; // радиус взаимодействия

            // Смещение точки взгляда перед Омори
            let lookX = player.x;
            let lookY = player.y;
            if (player.dir === 'up') lookY -= 18;
            if (player.dir === 'down') lookY += 18;
            if (player.dir === 'left') lookX -= 18;
            if (player.dir === 'right') lookX += 18;

            for (const obj of list) {
                const d = Math.hypot(obj.x - lookX, obj.y - lookY);
                if (d < bestDist) {
                    bestDist = d;
                    best = obj;
                }
            }
            return best;
        }

                        choices: [
