                                label: 'Дать лапку и погладить Батона',
                                action: () => {
                                    flags.mewoPetCount++;
                                    flags.batonHeartTimer = 75;
                                    sound.playBark();
                                    sound.playHeal();
                                    startDialogue([
                                        {
                                            speaker: 'БАТОН',
                                            text: 'Тяф-тяф! Батон радостно шевелит огромными пушистыми ушками и даёт Ане пятюню лапкой! Аня чувствует прилив смелости.',
                                            portrait: 'OMORI',
                                            emotion: 'CALM'
                                        }
                                    ]);
                                }
                            },
                            {
                                label: 'Просто полюбоваться',
                                action: () => {
                                    startDialogue([
                                        {
                                            speaker: 'АНЯ',
                                            text: 'Аня тепло улыбается, глядя на огромные уши, белую полоску на лбу и крошечную лапку Батона.',
                                            portrait: 'OMORI',
                                            emotion: 'NEUTRAL'
                                        }
                                    ]);
                                }
                            }
                        ]
                    }
                );
            } else if (obj.id === 'laptop') {
                flags.inspectedLaptop = true;
                startDialogue(
                    [
                        {
                            speaker: 'НОУТБУК',
                            text: 'Экран ноутбука излучает сухой тёплый шум. Что ты хочешь сделать?',
                            portrait: 'OMORI',
                            emotion: 'NEUTRAL'
                        }
                    ],
                    {
                        choices: [
                            {
                                label: 'Смотреть в экран',
                                action: () => {
                                    startDialogue([
                                        {
                                            speaker: 'НОУТБУК',
                                            text: 'Аня смотрит на мерцающий экран ноутбука. В Белом Пространстве всё так же тихо.',
                                            portrait: 'OMORI',
                                            emotion: 'NEUTRAL'
                                        }
                                    ]);
                                }
                            }
                        ]
                    }
                );
            } else if (obj.id === 'sketchbook') {
                flags.inspectedSketchbook = true;
                sketchbookPage = 0;
                currentState = GAME_STATE.SKETCHBOOK;
            } else if (obj.id === 'tissues') {
                flags.inspectedTissues = true;
                startDialogue([
                    {
                        speaker: 'КОРОБКА САЛФЕТОК',
                        text: 'Коробка белых бумажных салфеток. Для того, чтобы вытирать свои печали.',
                        portrait: 'OMORI',
                        emotion: 'SAD'
                    }
                ]);
            } else if (obj.id === 'knife') {
                flags.hasKnife = true;
                flags.doorSpawned = true;
                sound.playSlash();
                startDialogue([
                    {
                        speaker: 'БЕЛОЕ ПРОСТРАНСТВО',
                        text: 'Ты поднял БЛЕСТЯЩИЙ НОЖ. В холодном лезвии отражается твоё собственное безэмоциональное лицо.',
                        portrait: 'OMORI',
                        emotion: 'NEUTRAL'
                    },
                    {
                        speaker: 'БЕЛОЕ ПРОСТРАНСТВО',
                        text: 'Тук... тук... Внизу комнаты бесшумно появилась БЕЛАЯ ДВЕРЬ, отбрасывая слабую тень.',
                        portrait: 'OMORI',
                        emotion: 'AFRAID'
                    }
                ]);
            } else if (obj.id === 'whitedoor') {
                startDialogue(
                    [
                        {
                            speaker: 'БЕЛАЯ ДВЕРЬ',
                            text: 'Белая дверь отбрасывает слабую тень. Открыть её и сделать шаг наружу?',
                            portrait: 'OMORI',
                            emotion: 'NEUTRAL'
                        }
                    ],
                    {
                        choices: [
                            {
                                label: 'Открыть дверь',
                                action: () => {
                                    sound.playConfirm();
                                    currentLocation = 'CORRIDOR';
                                    player.x = 400;
                                    player.y = 435;
                                    player.dir = 'up';
                                    sound.setTheme('corridor');
                                    locationBadge.textContent = 'Локация: КОРИДОР ВОСПОМИНАНИЙ';
                                    startDialogue([
                                        {
                                            speaker: 'КОРИДОР ВОСПОМИНАНИЙ',
                                            text: 'Белизна сменяется сумеречным фиолетовым светом. Впереди на полу лежит знакомая ФОТОГРАФИЯ.',
                                            portrait: 'OMORI',
                                            emotion: 'NEUTRAL'
                                        }
                                    ]);
                                }
                            },
                            {
                                label: 'Остаться здесь',
                                action: () => {}
                            }
                        ]
                    }
                );
            } else if (obj.id === 'return_door') {
                currentLocation = 'WHITE_SPACE';
                player.x = 400;
                player.y = 415;
                player.dir = 'up';
                sound.setTheme('whitespace');
                locationBadge.textContent = 'Локация: БЕЛОЕ ПРОСТРАНСТВО';
            } else if (obj.id === 'memory_friends') {
                startDialogue([
                    {
                        speaker: 'ТЁПЛЫЕ ГОЛОСА',
                        text: '«Аня! Мы так долго ждали тебя! Спасибо, что ты есть!»',
                        portrait: 'OMORI',
                        emotion: 'NEUTRAL'
                    },
                    {
                        speaker: 'КОРИДОР ВОСПОМИНАНИЙ',
                        text: 'Силуэты друзей мягко улыбаются, согревая это место теплом.',
                        portrait: 'OMORI',
                        emotion: 'CALM'
                    }
                ]);
            } else if (obj.id === 'memory_mari') {
                startDialogue([
                    {
                        speaker: 'ТИХАЯ МЕЛОДИЯ',
                        text: 'Старое пианино. На пюпитре лежат ноты дуэта для скрипки и фортепиано.',
                        portrait: 'OMORI',
                        emotion: 'SAD'
                    },
                    {
                        speaker: 'ШЁПОТ',
                        text: '«Прости меня... Я просто хотела, чтобы всё получилось идеально...»',
                        portrait: 'OMORI',
                        emotion: 'AFRAID'
                    }
                ]);
            } else if (obj.id === 'fallen_photo') {
                sound.playScare();
                startDialogue(
                    [
                        {
                            speaker: 'ВЫПАВШАЯ ФОТОГРАФИЯ',
                            text: 'Ты поднимаешь снимок с пола. На нём брат и сестра стоят у дерева в солнечный день.',
                            portrait: 'OMORI',
                            emotion: 'SAD'
                        },
                        {
                            speaker: '???',
                            text: 'Внезапно фотографию пронзают густые чёрные линии! Из темноты к тебе тянутся КРАСНЫЕ РУКИ!',
                            portrait: 'SOMETHING',
                            emotion: 'AFRAID'
                        }
                    ],
                    {
                        onFinish: () => {
                            initBattle();
                        }
                    }
                );
            }
        }

        /***********************************************************************
         * УПРАВЛЕНИЕ С КЛАВИАТУРЫ, МЫШИ И СЕНСОРНОГО ЭКРАНА
         ***********************************************************************/
        const keys = {};

        window.addEventListener('keydown', (e) => {
            sound.init();
            keys[e.code] = true;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }

            handleDiscreteKeyPress(e.code);
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function handleDiscreteKeyPress(code) {
            const isAction = code === 'KeyZ' || code === 'Enter' || code === 'Space';
            const isCancel = code === 'KeyX' || code === 'Escape' || code === 'ShiftLeft' || code === 'ShiftRight';
            const isUp = code === 'ArrowUp' || code === 'KeyW';
            const isDown = code === 'ArrowDown' || code === 'KeyS';
            const isLeft = code === 'ArrowLeft' || code === 'KeyA';
            const isRight = code === 'ArrowRight' || code === 'KeyD';

            // 1. Титульный экран
            if (currentState === GAME_STATE.TITLE) {
                if (isAction) {
                    startNewGame();
                }
                return;
            }

            // 2. Экран концовки
            if (currentState === GAME_STATE.ENDING) {
                if (isAction) {
                    resetToTitle();
                }
                return;
            }

            // 3. Просмотр Альбома для рисования
            if (currentState === GAME_STATE.SKETCHBOOK) {
                if (isLeft) {
                    sketchbookPage = (sketchbookPage - 1 + sketchbookDrawings.length) % sketchbookDrawings.length;
                    sound.playCursor();
                } else if (isRight) {
                    sketchbookPage = (sketchbookPage + 1) % sketchbookDrawings.length;
                    sound.playCursor();
                } else if (isAction || isCancel) {
                    sound.playConfirm();
                    currentState = GAME_STATE.EXPLORE;
                    checkKnifeTrigger();
                }
                return;
            }

            // 4. Активный диалог
            if (dialogue.active) {
                if (dialogue.choices && dialogue.charIndex >= getCurrentPageText().length && dialogue.pageIndex === dialogue.pages.length - 1) {
                    if (isUp) {
                        dialogue.choiceIndex = (dialogue.choiceIndex - 1 + dialogue.choices.length) % dialogue.choices.length;
                        sound.playCursor();
                        return;
                    }
                    if (isDown) {
                        dialogue.choiceIndex = (dialogue.choiceIndex + 1) % dialogue.choices.length;
                        sound.playCursor();
                        return;
                    }
                }
                if (isAction || isCancel) {
                    advanceDialogue();
                }
                return;
            }

            // 5. Пошаговая битва
            if (currentState === GAME_STATE.BATTLE) {
                if (battle.phase === 'MENU') {
                    if (isRight && battle.menuIndex % 2 === 0) { battle.menuIndex++; sound.playCursor(); }
                    if (isLeft && battle.menuIndex % 2 === 1) { battle.menuIndex--; sound.playCursor(); }
                    if (isDown && battle.menuIndex < 2) { battle.menuIndex += 2; sound.playCursor(); }
                    if (isUp && battle.menuIndex >= 2) { battle.menuIndex -= 2; sound.playCursor(); }

                    if (isAction) {
                        if (battle.menuIndex === 0) {
                            executePlayerBattleAction('ATTACK');
                        } else if (battle.menuIndex === 1) {
                            battle.phase = 'SUBMENU';
                            battle.subMenuType = 'SKILLS';
                            battle.subMenuIndex = 0;
                            sound.playConfirm();
                        } else if (battle.menuIndex === 2) {
                            battle.phase = 'SUBMENU';
                            battle.subMenuType = 'SNACKS';
                            battle.subMenuIndex = 0;
                            sound.playConfirm();
                        } else if (battle.menuIndex === 3) {
                            battle.phase = 'SUBMENU';
                            battle.subMenuType = 'TOYS';
                            battle.subMenuIndex = 0;
                            sound.playConfirm();
                        }
                    }
                } else if (battle.phase === 'SUBMENU') {
                    const maxLen = battle.subMenuType === 'SKILLS' ? battle.skills.length :
                                   (battle.subMenuType === 'SNACKS' ? battle.snacks.length : battle.toys.length);
                    if (isUp) {
                        battle.subMenuIndex = (battle.subMenuIndex - 1 + maxLen) % maxLen;
                        sound.playCursor();
                    }
                    if (isDown) {
                        battle.subMenuIndex = (battle.subMenuIndex + 1) % maxLen;
                        sound.playCursor();
                    }
                    if (isCancel) {
                        battle.phase = 'MENU';
                        sound.playCursor();
                    }
                    if (isAction) {
                        if (battle.subMenuType === 'SKILLS') {
                            const sk = battle.skills[battle.subMenuIndex];
                            if (battle.omori.juice >= sk.cost) {
                                executePlayerBattleAction('SKILL', battle.subMenuIndex);
                            } else {
                                battle.logText = 'Недостаточно СОКА для этого навыка!';
                            }
                        } else if (battle.subMenuType === 'SNACKS') {
                            const sn = battle.snacks[battle.subMenuIndex];
                            if (sn.count > 0) executePlayerBattleAction('SNACK', battle.subMenuIndex);
                        } else if (battle.subMenuType === 'TOYS') {
                            const ty = battle.toys[battle.subMenuIndex];
                            if (ty.count > 0) executePlayerBattleAction('TOY', battle.subMenuIndex);
                        }
                    }
                } else if (battle.phase === 'FINAL_CHOICE') {
                    if (isUp || isDown) {
                        battle.choiceIndex = battle.choiceIndex === 0 ? 1 : 0;
                        sound.playCursor();
                    }
                    if (isAction) {
                        finishStoryChoice(battle.choiceIndex);
                    }
                }
                return;
            }

            // 6. Исследование мира
            if (currentState === GAME_STATE.EXPLORE && isAction) {
                const target = getClosestInteractable();
                if (target) {
                    triggerInteraction(target);
                }
            }
        }

        function finishStoryChoice(choiceIdx) {
            sound.playConfirm();
            if (choiceIdx === 0) {
                flags.endingType = 'ACCEPT';
                sound.setTheme('ending');
                locationBadge.textContent = 'ЭПИЛОГ: ПРОБУЖДЕНИЕ';
            } else {
                flags.endingType = 'SUPPRESS';
                sound.setTheme('whitespace');
                locationBadge.textContent = 'Локация: БЕЛОЕ ПРОСТРАНСТВО';
            }
            currentState = GAME_STATE.ENDING;
        }

        function startNewGame() {
            sound.init();
            sound.playConfirm();
            sound.setTheme('whitespace');
            currentState = GAME_STATE.EXPLORE;
            currentLocation = 'WHITE_SPACE';
            player.x = 400;
            player.y = 335;
            player.dir = 'down';
            player.emotion = 'NEUTRAL';
            locationBadge.textContent = 'Локация: БЕЛОЕ ПРОСТРАНСТВО';

            startDialogue([
                {
                    speaker: 'БЕЛОЕ ПРОСТРАНСТВО',
                    text: 'Добро пожаловать в БЕЛОЕ ПРОСТРАНСТВО. Ты живёшь здесь столько, сколько себя помнишь.',
                    portrait: 'OMORI',
                    emotion: 'NEUTRAL'
                },
                {
                    speaker: 'БЕЛОЕ ПРОСТРАНСТВО',
                    text: 'Осмотри знакомые вещи вокруг коврика с помощью клавиши [Z] или кнопки действия.',
                    portrait: 'OMORI',
                    emotion: 'NEUTRAL'
                }
            ]);
        }

        function resetToTitle() {
            sound.playConfirm();
            flags.inspectedMewo = false;
            flags.inspectedLaptop = false;
            flags.inspectedSketchbook = false;
            flags.inspectedTissues = false;
            flags.inspectedLightbulb = false;
            flags.knifeSpawned = false;
            flags.hasKnife = false;
            flags.doorSpawned = false;
            flags.endingType = null;
            dialogue.active = false;
            currentState = GAME_STATE.TITLE;
            currentLocation = 'WHITE_SPACE';
            sound.setTheme('whitespace');
            locationBadge.textContent = 'Локация: БЕЛОЕ ПРОСТРАНСТВО';
        }

        // Поддержка клика мышкой и тача прямо по холсту
        canvas.addEventListener('pointerdown', (e) => {
            sound.init();
            const rect = canvas.getBoundingClientRect();
            const mx = ((e.clientX - rect.left) / rect.width) * W;
            const my = ((e.clientY - rect.top) / rect.height) * H;

            if (currentState === GAME_STATE.TITLE) {
                startNewGame();
                return;
            }
            if (currentState === GAME_STATE.ENDING) {
                resetToTitle();
                return;
            }
            if (currentState === GAME_STATE.SKETCHBOOK) {
                if (mx < W / 2) {
                    sketchbookPage = (sketchbookPage + 1) % sketchbookDrawings.length;
                    sound.playCursor();
                } else {
                    currentState = GAME_STATE.EXPLORE;
                    sound.playConfirm();
                    checkKnifeTrigger();
                }
                return;
            }
            if (dialogue.active) {
                if (dialogue.choices && dialogue.charIndex >= getCurrentPageText().length && dialogue.pageIndex === dialogue.pages.length - 1) {
                    const chH = 26 + dialogue.choices.length * 36;
                    const chY = 426 - chH - 12;
                    dialogue.choices.forEach((c, idx) => {
                        const itemY = chY + 12 + idx * 34;
                        if (mx >= 54 && mx <= 394 && my >= itemY && my <= itemY + 32) {
                            dialogue.choiceIndex = idx;
                        }
                    });
                }
                advanceDialogue();
                return;
            }
            if (currentState === GAME_STATE.BATTLE) {
                const actX = 294, actY = 390;
                if (battle.phase === 'MENU') {
                    for (let idx = 0; idx < 4; idx++) {
                        const col = idx % 2;
                        const row = Math.floor(idx / 2);
                        const bx = actX + 20 + col * 220;
                        const by = actY + 20 + row * 78;
                        if (mx >= bx && mx <= bx + 208 && my >= by && my <= by + 66) {
                            battle.menuIndex = idx;
                            handleDiscreteKeyPress('KeyZ');
                            return;
                        }
                    }
                } else if (battle.phase === 'SUBMENU') {
                    for (let idx = 0; idx < 4; idx++) {
                        const iy = actY + 10 + idx * 30;
                        if (mx >= actX + 10 && mx <= actX + 440 && my >= iy && my <= iy + 28) {
                            battle.subMenuIndex = idx;
                            handleDiscreteKeyPress('KeyZ');
                            return;
                        }
                    }
                    handleDiscreteKeyPress('KeyX');
                } else if (battle.phase === 'FINAL_CHOICE') {
                    for (let idx = 0; idx < 2; idx++) {
                        const cy = actY + 52 + idx * 62;
                        if (mx >= actX + 18 && mx <= actX + 452 && my >= cy && my <= cy + 54) {
                            battle.choiceIndex = idx;
                            finishStoryChoice(idx);
                            return;
                        }
                    }
                }
                return;
            }

            // Если в режиме исследования кликнули по предмету рядом — взаимодействуем
            if (currentState === GAME_STATE.EXPLORE) {
                const target = getClosestInteractable();
                if (target) {
                    triggerInteraction(target);
                }
            }
        });

        // Кнопки звука и сброса
        document.getElementById('btn-audio').addEventListener('click', () => {
            const isMuted = sound.toggleMute();
            document.getElementById('audio-icon').textContent = isMuted ? '🔇' : '🔊';
            document.getElementById('audio-label').textContent = isMuted ? 'ЗВУК: ВЫКЛ' : 'ЗВУК: ВКЛ';
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            resetToTitle();
        });

        /***********************************************************************
         * ОСНОВНОЙ ИГРОВОЙ ЦИКЛ (UPDATE & RENDER)
         ***********************************************************************/
        function updateGame(timestamp) {
            // 1. Обновление кадра дрожащей линии (line-boil каждые 150 мс)
            if (timestamp - lastBoilTime >= BOIL_INTERVAL) {
                boilFrame = (boilFrame + 1) % 3;
                lastBoilTime = timestamp;
            }

            // 2. Обновление процедурного саундтрека
            sound.update();

            // 3. Обновление побуквенного вывода диалога
            if (dialogue.active) {
                const fullText = getCurrentPageText();
                if (dialogue.charIndex < fullText.length) {
                    dialogue.charIndex += 0.65;
                    dialogue.charTimer++;
                    if (dialogue.charTimer % 3 === 0) {
                        const isCreepy = dialogue.portrait === 'SOMETHING';
                        sound.playTextBlip(dialogue.portrait === 'MEWO' ? 760 : 520, isCreepy);
                    }
                }
                return;
            }

            // 4. Движение Омори в режиме исследования
            if (currentState === GAME_STATE.EXPLORE) {
                let dx = 0, dy = 0;
                if (keys['ArrowUp'] || keys['KeyW']) { dy -= 1; player.dir = 'up'; }
                if (keys['ArrowDown'] || keys['KeyS']) { dy += 1; player.dir = 'down'; }
                if (keys['ArrowLeft'] || keys['KeyA']) { dx -= 1; player.dir = 'left'; }
                if (keys['ArrowRight'] || keys['KeyD']) { dx += 1; player.dir = 'right'; }

                if (dx !== 0 || dy !== 0) {
                    const len = Math.hypot(dx, dy);
                    const isRunning = keys['KeyX'] || keys['ShiftLeft'] || keys['ShiftRight'];
                    const spd = isRunning ? player.runSpeed : player.speed;
                    const nx = player.x + (dx / len) * spd;
                    const ny = player.y + (dy / len) * spd;

                    // Границы локаций
                    let minX = 90, maxX = 710, minY = 120, maxY = 520;
                    if (currentLocation === 'CORRIDOR') {
                        minX = 235; maxX = 565; minY = 135; maxY = 525;
                    }

                    player.x = Math.max(minX, Math.min(maxX, nx));
                    player.y = Math.max(minY, Math.min(maxY, ny));
                    player.moving = true;

                    player.stepTimer++;
                    if (player.stepTimer >= (isRunning ? 6 : 9)) {
                        player.stepFrame = (player.stepFrame + 1) % 4;
                        player.stepTimer = 0;
                    }
                } else {
                    player.moving = false;
                    player.stepFrame = 0;
                }
            }
        }

        function renderGame() {
            ctx.clearRect(0, 0, W, H);

            if (currentState === GAME_STATE.TITLE) {
                drawTitleScreen();
                return;
            }

            if (currentState === GAME_STATE.ENDING) {
                drawEndingScreen();
                return;
            }

            if (currentState === GAME_STATE.SKETCHBOOK) {
                drawSketchbookModal();
                return;
            }

            if (currentState === GAME_STATE.BATTLE) {
                drawBattleScene();
                return;
            }

            // Отрисовка текущей локации
            if (currentLocation === 'WHITE_SPACE') {
                drawWhiteSpace();
            } else if (currentLocation === 'CORRIDOR') {
                drawCorridorLocation();
            }

            // Подсказка взаимодействия над предметом, если Омори стоит рядом
            if (!dialogue.active && currentState === GAME_STATE.EXPLORE) {
                const closest = getClosestInteractable();
                if (closest) {
                    const bob = Math.sin(Date.now() / 180) * 3;
                    const label = `[Z] ${closest.name}`;
                    ctx.save();
                    ctx.font = 'bold 12px "Comfortaa", sans-serif';
                    const tw = ctx.measureText(label).width + 22;
                    const bx = Math.max(12, Math.min(W - tw - 12, closest.x - tw / 2));
                    const by = Math.max(14, closest.y - 58 + bob);

                    drawOmoriBox(bx, by, tw, 28, {
                        fill: '#08080a',
                        border: '#ef4444',
                        doubleBorder: false,
                        seed: 901,
                        boilAmp: 0.9
                    });
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.fillText(label, bx + tw / 2, by + 18);
                    ctx.restore();
                }
            }

            // Отрисовка диалогового интерфейса поверх мира
            drawDialogueOverlay();
        }

        function gameLoop(timestamp) {
            updateGame(timestamp || 0);
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        window.onload = function () {
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
